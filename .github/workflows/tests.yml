name: Tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
