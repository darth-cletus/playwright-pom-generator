name: Tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -c companion/constraints.txt -e './companion[dev]'
      - run: python -m ruff check companion
      - run: python -m ruff format --check companion
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest companion -q -s
      - run: npm run test:browser
        env:
          POM_INSPECTOR_SCREENSHOTS: ${{ runner.temp }}/pom-inspector-screenshots
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: inspector-fixture-screenshots
          path: ${{ runner.temp }}/pom-inspector-screenshots
          if-no-files-found: ignore
